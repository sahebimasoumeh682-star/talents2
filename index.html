<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعدادهای الهه مهر</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }

  .header { text-align: center; margin-bottom: 30px; }

  .header h1 {
    font-size: 3rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 3px 3px 8px rgba(0,0,0,0.4);
    padding: 20px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    border: 3px solid rgba(255,255,255,0.4);
    letter-spacing: 2px;
  }

  .container { max-width: 800px; margin: 0 auto; }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    margin-bottom: 25px;
  }

  .card h2 {
    color: #764ba2;
    margin-bottom: 20px;
    font-size: 1.5rem;
    border-bottom: 3px solid #667eea;
    padding-bottom: 10px;
  }

  label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }

  input[type="text"], select {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    margin-bottom: 18px;
    transition: 0.3s;
    background: #f9f9ff;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 10px rgba(102,126,234,0.4);
  }

  button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    padding: 15px 30px;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    transition: 0.3s;
    font-family: inherit;
  }

  button:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(118,75,162,0.5); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .talent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .talent-option {
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    background: #f9f9ff;
    font-weight: bold;
  }

  .talent-option:hover { border-color: #667eea; background: #eef1ff; }

  .talent-option.selected {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border-color: #764ba2;
    transform: scale(1.05);
  }

  .talent-option .emoji { font-size: 2rem; display: block; margin-bottom: 8px; }

  .message {
    padding: 15px;
    border-radius: 12px;
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
    display: none;
  }

  .message.success {
    background: #d4edda; color: #155724;
    border: 2px solid #28a745; display: block;
  }

  .message.error {
    background: #f8d7da; color: #721c24;
    border: 2px solid #dc3545; display: block;
  }

  .student-list { list-style: none; }

  .student-list li {
    background: #f9f9ff;
    border-right: 5px solid #667eea;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .student-list .name { font-weight: bold; color: #333; font-size: 1.1rem; }

  .student-list .talent {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 0.9rem;
  }

  .empty-msg { text-align: center; color: #888; padding: 20px; }

  .delete-btn {
    background: #dc3545;
    width: auto;
    padding: 6px 12px;
    font-size: 0.85rem;
    margin: 0;
  }

  .delete-btn:hover { background: #c82333; box-shadow: 0 5px 15px rgba(220,53,69,0.4); }

  .stats { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }

  .stat-box {
    flex: 1;
    min-width: 120px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
  }

  .stat-box .num { font-size: 2rem; font-weight: bold; display: block; }
  .stat-box .lbl { font-size: 0.9rem; opacity: 0.9; }

  .loading { text-align: center; color: #667eea; padding: 20px; font-weight: bold; }

  @media (max-width: 600px) {
    .header h1 { font-size: 1.8rem; padding: 15px; }
    .card { padding: 20px; }
    .talent-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>✨ استعدادهای الهه مهر ✨</h1>
</div>

<div class="container">

  <div class="card">
    <h2>📝 ثبت استعداد دانش‌آموز</h2>

    <label for="firstName">نام:</label>
    <input type="text" id="firstName" placeholder="نام خود را وارد کنید" maxlength="30">

    <label for="lastName">نام خانوادگی:</label>
    <input type="text" id="lastName" placeholder="نام خانوادگی خود را وارد کنید" maxlength="30">

    <label>استعداد خود را انتخاب کنید:</label>
    <div class="talent-grid" id="talentGrid"></div>

    <button id="submitBtn" onclick="registerStudent()">ثبت استعداد</button>

    <div class="message" id="message"></div>
  </div>

  <div class="card">
    <h2>📊 آمار کلی</h2>
    <div class="stats">
      <div class="stat-box">
        <span class="num" id="totalCount">0</span>
        <span class="lbl">کل دانش‌آموزان</span>
      </div>
      <div class="stat-box">
        <span class="num" id="topTalent">-</span>
        <span class="lbl">محبوب‌ترین استعداد</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>👥 لیست دانش‌آموزان ثبت‌شده</h2>
    <ul class="student-list" id="studentList">
      <li class="loading">در حال بارگذاری...</li>
    </ul>
  </div>

</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ================== تنظیمات Supabase ==================
  const SUPABASE_URL = 'https://krumvyihfrkmvaodbdyy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_PCkGbAdEPzNYtEuLs0ovSw_WaN-9TD6';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  // =======================================================

  const talents = [
    { id: 'sport',    name: 'ورزش',        emoji: '⚽' },
    { id: 'art',      name: 'نقاشی',       emoji: '🎨' },
    { id: 'music',    name: 'موسیقی',      emoji: '🎵' },
    { id: 'math',     name: 'ریاضی',       emoji: '🔢' },
    { id: 'science',  name: 'علوم',        emoji: '🔬' },
    { id: 'writing',  name: 'نویسندگی',    emoji: '✍️' },
    { id: 'theater',  name: 'تئاتر',       emoji: '🎭' },
    { id: 'computer', name: 'کامپیوتر',    emoji: '💻' },
    { id: 'language', name: 'زبان‌های خارجی', emoji: '🌍' },
    { id: 'quran',    name: 'قرآن و معارف', emoji: '📖' },
    { id: 'chess',    name: 'شطرنج',       emoji: '♟️' },
    { id: 'cooking',  name: 'آشپزی',       emoji: '🍳' }
  ];

  let selectedTalent = null;
  let students = [];

  // ساخت گزینه‌های استعداد
  function renderTalents() {
    const grid = document.getElementById('talentGrid');
    grid.innerHTML = '';
    talents.forEach(t => {
      const div = document.createElement('div');
      div.className = 'talent-option';
      div.dataset.id = t.id;
      div.innerHTML = `<span class="emoji">${t.emoji}</span>${t.name}`;
      div.onclick = () => selectTalent(t.id, div);
      grid.appendChild(div);
    });
  }

  function selectTalent(id, el) {
    document.querySelectorAll('.talent-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedTalent = id;
  }

  // ============ ثبت دانش‌آموز در Supabase ============
  async function registerStudent() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName  = document.getElementById('lastName').value.trim();
    const btn = document.getElementById('submitBtn');

    if (!firstName || !lastName) {
      showMessage('لطفاً نام و نام خانوادگی خود را وارد کنید.', 'error');
      return;
    }

    if (!selectedTalent) {
      showMessage('لطفاً استعداد خود را انتخاب کنید.', 'error');
      return;
    }

    const talent = talents.find(t => t.id === selectedTalent);

    btn.disabled = true;
    btn.textContent = 'در حال ثبت...';

    const { data, error } = await supabaseClient
      .from('students')
      .insert([{
        first_name: firstName,
        last_name: lastName,
        talent: talent.name,
        emoji: talent.emoji
      }])
      .select();

    btn.disabled = false;
    btn.textContent = 'ثبت استعداد';

    if (error) {
      console.error(error);
      showMessage('❌ خطا در ثبت اطلاعات: ' + error.message, 'error');
      return;
    }

    showMessage(`✅ ${firstName} ${lastName} عزیز، استعداد «${talent.name}» با موفقیت ثبت شد!`, 'success');

    document.getElementById('firstName').value = '';
    document.getElementById('lastName').value = '';
    document.querySelectorAll('.talent-option').forEach(o => o.classList.remove('selected'));
    selectedTalent = null;

    await loadStudents();
  }

  // ============ خواندن دانش‌آموزان از Supabase ============
  async function loadStudents() {
    const list = document.getElementById('studentList');

    const { data, error } = await supabaseClient
      .from('students')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      list.innerHTML = `<li class="empty-msg">خطا در بارگذاری: ${error.message}</li>`;
      return;
    }

    students = data || [];
    renderStudents();
    renderStats();
  }

  function renderStudents() {
    const list = document.getElementById('studentList');
    list.innerHTML = '';

    if (students.length === 0) {
      list.innerHTML = '<li class="empty-msg">هنوز هیچ دانش‌آموزی ثبت‌نام نکرده است.</li>';
      return;
    }

    students.forEach(s => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="name">${s.emoji || ''} ${s.first_name} ${s.last_name}</span>
        <span class="talent">${s.talent}</span>
        <button class="delete-btn" onclick="deleteStudent('${s.id}')">حذف</button>
      `;
      list.appendChild(li);
    });
  }

  // ============ حذف دانش‌آموز ============
  async function deleteStudent(id) {
    if (!confirm('آیا از حذف این دانش‌آموز مطمئن هستید؟')) return;

    const { error } = await supabaseClient
      .from('students')
      .delete()
      .eq('id', id);

    if (error) {
      alert('خطا در حذف: ' + error.message);
      return;
    }

    await loadStudents();
  }

  function renderStats() {
    document.getElementById('totalCount').textContent = students.length;

    if (students.length === 0) {
      document.getElementById('topTalent').textContent = '-';
      return;
    }

    const counts = {};
    students.forEach(s => {
      counts[s.talent] = (counts[s.talent] || 0) + 1;
    });

    let top = '';
    let max = 0;
    for (const [k, v] of Object.entries(counts)) {
      if (v > max) { max = v; top = k; }
    }
    document.getElementById('topTalent').textContent = top;
  }

  function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = 'message ' + type;
    setTimeout(() => { msg.className = 'message'; }, 5000);
  }

  // ============ اجرای اولیه ============
  renderTalents();
  loadStudents();
</script>

</body>
</html>
